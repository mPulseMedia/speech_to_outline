<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Log</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    background: #fff;
    color: #111;
    padding: 24px 32px;
    max-width: 860px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 20px;
    color: #333;
  }
  .node { user-select: none; }
  .node-row {
    display: flex;
    align-items: flex-start;
    gap: 4px;
    padding: 2px 0;
    cursor: default;
    border-radius: 3px;
  }
  .node-row:hover { background: #f5f5f5; }
  .toggle {
    flex-shrink: 0;
    width: 16px;
    height: 18px;
    line-height: 18px;
    text-align: center;
    font-size: 10px;
    color: #888;
    cursor: pointer;
    border-radius: 2px;
  }
  .toggle:hover { background: #e8e8e8; color: #333; }
  .toggle.leaf { cursor: default; color: #ccc; }
  .toggle.leaf:hover { background: none; }
  .bullet {
    flex-shrink: 0;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #888;
    margin-top: 6px;
  }
  .label {
    flex: 1;
    line-height: 1.5;
    padding-right: 8px;
    white-space: pre-wrap;
  }
  .children {
    margin-left: 22px;
    border-left: 1px solid #eee;
    padding-left: 8px;
  }
  .collapsed > .children { display: none; }
  /* thread-level styling */
  .depth-0 > .node-row > .label { font-weight: 600; color: #1a1a1a; font-size: 13px; }
  /* prompt entry */
  .depth-1 > .node-row > .label { font-weight: 500; color: #333; }
</style>
</head>
<body>
<h1>Prompt Log</h1>
<div id="root"></div>

<script src="prompt_log_data.js"></script>
<script>
function buildNode(node, depth) {
  const hasChildren = node.children && node.children.length > 0;
  const wrapper = document.createElement("div");
  wrapper.className = "node depth-" + depth;
  if (!node.open) wrapper.classList.add("collapsed");

  const row = document.createElement("div");
  row.className = "node-row";

  const toggle = document.createElement("span");
  toggle.className = "toggle" + (hasChildren ? "" : " leaf");
  toggle.textContent = hasChildren ? (node.open ? "▾" : "▸") : "·";
  if (hasChildren) {
    toggle.addEventListener("click", () => {
      wrapper.classList.toggle("collapsed");
      toggle.textContent = wrapper.classList.contains("collapsed") ? "▸" : "▾";
    });
  }

  const bullet = document.createElement("span");
  bullet.className = "bullet";

  const label = document.createElement("span");
  label.className = "label";
  label.textContent = node.label;

  row.appendChild(toggle);
  row.appendChild(bullet);
  row.appendChild(label);
  wrapper.appendChild(row);

  if (hasChildren) {
    const children = document.createElement("div");
    children.className = "children";
    node.children.forEach(child => children.appendChild(buildNode(child, depth + 1)));
    wrapper.appendChild(children);
  }

  return wrapper;
}

const root = document.getElementById("root");
PROMPT_LOG.forEach(node => root.appendChild(buildNode(node, 0)));
</script>
</body>
</html>
